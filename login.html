<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Portal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md px-10 py-10">
        <div class="flex justify-center mb-5">
            <div class="bg-blue-600 rounded-2xl p-4">
                <i class="ri-graduation-cap-fill text-4xl text-white"></i>
            </div>
        </div>
        <!-- HEADING -->
        <h1 class="text-3xl font-bold text-center text-gray-900 mb-1">Welcome Back</h1>
        <p class="text-center text-gray-500 text-sm mb-8">Sign in to access your exam portal</p>

        <form action="auth.php" method="POST">
            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Register Number</label>
                <div
                    class="flex items-center border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
                    <i class="ri-user-3-line text-gray-400 text-lg mr-2"></i>
                    <input type="text" name="username" placeholder="e.g., 21CS001"
                        class="bg-transparent w-full outline-none text-gray-700 text-sm">
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    Password
                </label>
                <div
                    class="flex items-center border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
                    <i class="ri-lock-line text-gray-400 text-lg mr-2"></i>
                    <input type="password" name="password" id="passwordInput" placeholder="Enter your password"
                        class="bg-transparent w-full outline-none text-gray-700 text-sm">
                    <button type="button" onclick="togglePassword()" class="focus:outline-none ml-2">
                        <i id="eyeIcon" class="ri-eye-line text-gray-400 hover:text-gray-600"></i>
                    </button>
                </div>
            </div>
            <!-- Remember me + Forgot password row -->
            <div class="flex items-center justify-between mb-6">
                <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                    <input type="checkbox" name="remember" class="w-4 h-4 accent-blue-600"> Remember me </label>
                <a href="forgot_password.php" class="text-sm text-blue-600 font-semibold hover:underline"> Forgot
                    password? </a>
            </div>
            <button type="submit"
                class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition duration-200">
                Sign In </button>
            <p class="text-center text-sm text-gray-500 mt-6">Don't have an account?
                <a href="register.php" class="text-blue-600 font-semibold hover:underline">Sign up</a>
            </p>

        </form>
    </div>
    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }
    </script>

</body>

</html>
